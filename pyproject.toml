[tool.poetry]
name = "prometheus-network-exporter"
version = "1.4.3"
description = "A Prometheus Network Exporter which connects via netconf ssh to the devices"
authors = ["Cellebyte <marcel.fest@live.de>"]
license = "MIT"

[tool.poetry.dependencies]
# pinned due to telnetlib being removed
python = "^3.12"
junos-eznc = "2.7.5"
PyYAML = "*"
tornado = "*"
prometheus_client = "*"
fqdn = "*"
voluptuous = "*"
paramiko = "*"
cached-property = "*"
pygnmi = "^0.8.15"

[tool.poetry.group.dev.dependencies]
flake8 = "*"
PySocks = "*"
pyinstaller = "*"
mypy = "*"
black = "^21.8b0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["prometheus_network_exporter"]
# Legacy device types without a handler that creates them; only Junos
# devices are scraped.
omit = [
    "prometheus_network_exporter/devices/arubadevice.py",
    "prometheus_network_exporter/devices/ciscodevice.py",
    "prometheus_network_exporter/devices/ubntdevice.py",
    "prometheus_network_exporter/config/functions/unifi/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
