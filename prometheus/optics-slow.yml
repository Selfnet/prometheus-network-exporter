# Add this job under scrape_configs in the main Prometheus configuration.
# The target file contains switch hostnames, not exporter addresses.
# Include only default/access/legacy targets, not targets using core_slow.
- job_name: junos_optics_slow
  scrape_interval: 300s
  scrape_timeout: 120s
  metrics_path: /device
  params:
    module: [optics_slow]
  file_sd_configs:
    - files: [junos_optics_targets.json]
  relabel_configs:
    - source_labels: [__address__]
      target_label: __param_target
    - source_labels: [__param_target]
      target_label: instance
    - target_label: __address__
      replacement: exporter.example:9332
