name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  POETRY_VERSION: "2.5.1"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: poetry
      - name: Lock file matches pyproject.toml
        run: poetry check --lock
      - name: Install
        run: poetry install --with dev
      - name: Formatting
        run: poetry run black --check prometheus_network_exporter tests
      - name: Lint
        run: poetry run flake8 prometheus_network_exporter tests
      - name: Types
        run: poetry run mypy
      - name: Unit tests
        run: poetry run coverage run -m pytest
      - name: Coverage
        run: poetry run coverage report

  rules:
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: "3.5.0"
      PROMETHEUS_SHA256: "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install promtool
        run: |
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -sSfL -o "${archive}" "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}"
          echo "${PROMETHEUS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
      - name: Check rules
        run: promtool check rules prometheus/rules/*.yml
      - name: Test rules
        run: promtool test rules prometheus/tests/*.yml
