OspfNeighborTable:
  rpc: get-ospf-neighbor-information
  args:
    interface: '*[afgxe][et]*'
    extensive: True
  args_key: interface
  # Several neighbours can share one interface on a broadcast segment.
  key:
    - interface-name
    - neighbor-id
  item: ospf-neighbor
  view: OspfNeighborView

Ospf3NeighborTable:
  rpc: get-ospf3-neighbor-information
  args:
    interface: '*[afgxe][et]*'
    extensive: True
  args_key: interface
  key:
    - interface-name
    - neighbor-id
  item: ospf3-neighbor
  view: OspfNeighborView

OspfNeighborView:
  fields:
    interface_name: interface-name
    ospf_neighbor_state: { ospf-neighbor-state: True=Full }
    # neighbor-up-time is only part of the detail/extensive output.
    neighbor_up_time: { neighbor-up-time/@seconds: int }
    neighbor_id: neighbor-id
