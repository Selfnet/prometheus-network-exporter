
METRICS:
  Gauge:
  - metric: neighbor_state
    key: ospf_neighbor_state
    description: OSPF is (0(DOWN)/1(UP))
    function: is_ok
  - metric: neighbor_uptime_seconds
    key: neighbor_up_time
    description: Seconds since the OSPF neighbor adjacency was established

LABELS:
  - label: description
    key: description

  - label: MAC
    key: macaddr

  - label: speed
    key: speed

  - label: interface
    key: interface_name

  - label: neighbor
    key: neighbor_id

  - label: subinterface
    key: unit
