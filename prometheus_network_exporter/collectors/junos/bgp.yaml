---
METRICS:
  Counter:
    - metric: prefixes_received
      type: total
      key: pfx_rx
      description: Received Prefixes from Peer, summed over all RIBs. Deprecated, a gauge misdeclared as counter; use pyez_junos_bgp_peer_rib_received_prefixes
      function: sum

    - metric: prefixes_received_accepted
      type: total
      key: pfx_rx_accepted
      description: Accepted Prefixes from Peer, summed over all RIBs. Deprecated, a gauge misdeclared as counter; use pyez_junos_bgp_peer_rib_accepted_prefixes
      function: sum

  Gauge:
    - metric: is_up
      type: status
      key: peerstate
      description: BGP Session is established (0(DOWN)/1(UP))
      function: is_ok

LABELS:
  - label: peername
    key: peername

  - label: neighbor
    key: peeraddr

  - label: description
    key: description