---
default:
  device: junos
  auth:
    method: ssh_key
    username: pyez
    # password: 
    # ssh_key: ~/.ssh/priv_key
  metrics:
    - ospf
    - igmp
    - optics
    - inteface
    - interface_specifics
    - environment
    - bgp
    - routes
    - bfd
  # Only used by the routes and ospf metrics of junos devices.
  routing:
    tables:
      - inet.0
      - inet6.0
    watch:
      - 0.0.0.0/0
      - ::/0
    young_route_seconds: 300

aruba_ac:
  device: arubaos
  auth:
    method: password
    username: username
    password: password
    # verify: no <default: no>
    # port: 4343 <default: 4343>
    # http_secure: yes <default: yes>
    # proxy: socks5h://localhost:5050 <default: None>
  metrics:
    - clients
    - cpu
    - memory
    - system information
    - access point statistics
    - access point state
